name: 📦 Publish Coder Templates

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  discover:
    name: 🔍 Discover template projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Build template matrix
        id: set-matrix
        run: ./.github/scripts/build-template-matrix.sh

  publish:
    name: 🚀 Publish ${{ matrix.name }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      TEMPLATE_NAME: ${{ matrix.name }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔐 Create Wireguard overlay
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          sudo apt-get install -y resolvconf wireguard

          sudo install -d -m 700 /etc/wireguard
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0

      - name: 🛠️ Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"

      - name: 🧰 Set up Coder CLI
        uses: coder/setup-action@4a607a8113d4e676e2d7c34caa20a814bc88bfda # v1.1.0
        with:
          access_url: ${{ secrets.CODER_ACCESS_URL }}
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: 🔧 Terraform init
        run: terraform init -input=false

      - name: ✅ Terraform validate
        run: terraform validate -no-color

      - name: 🏷️ Get short commit SHA to use as template version name
        id: name
        run: echo "version_name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 💬 Get latest commit title to use as template version description
        id: message
        run: echo "commit_title=$(git log --format=%s -n 1 ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: 🚀 Push template to Coder
        run: |
          coder templates push \
            "$TEMPLATE_NAME" \
            --directory . \
            --activate=true \
            --name "${{ steps.name.outputs.version_name }}" \
            --message "${{ steps.message.outputs.commit_title }}" \
            --yes

      - name: 🔐 Tear down Wireguard overlay
        if: always()
        run: sudo wg-quick down wg0 || true
